services:
  db:
    image: postgres:16-alpine
    container_name: cau-inventory-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cau_inventory
      POSTGRES_USER: cau_user
      POSTGRES_PASSWORD: cau_password_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cau_user -d cau_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: development
    container_name: cau-inventory-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://cau_user:cau_password_dev@db:5432/cau_inventory
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      AUTH_SECRET: "cau-inventory-dev-secret-change-in-production"
      AUTH_TRUST_HOST: "true"
    command: sh -c "npm install && npx prisma generate && npx prisma db push && npx prisma db seed && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - next_cache:/app/.next

volumes:
  postgres_data:
  app_node_modules:
  next_cache:
